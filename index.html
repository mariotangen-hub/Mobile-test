<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena FPS">
<meta name="theme-color" content="#0b0e14">
<title>Arena FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0e14;
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- HUD ---- */
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
  }
  #crosshair {
    position: absolute; left: 50%; top: 50%;
    width: 26px; height: 26px; transform: translate(-50%, -50%);
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(255,255,255,0.85);
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

  #topbar {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px);
    left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: flex-start;
    padding-left: calc(env(safe-area-inset-left) + 18px);
    padding-right: calc(env(safe-area-inset-right) + 18px);
  }
  .stat { font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  #waveLabel { font-size: 20px; letter-spacing: 0.5px; }
  #scoreLabel { font-size: 20px; text-align: right; }
  #healthWrap {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top) + 16px);
    width: min(46vw, 260px); height: 16px;
    background: rgba(255,255,255,0.14); border-radius: 10px;
    overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  #healthBar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff4d4d, #ff8a4d);
    transition: width 0.12s linear;
  }

  /* ---- Touch controls ---- */
  #touchUI { position: absolute; inset: 0; display: none; }
  #joystick {
    position: absolute; width: 120px; height: 120px;
    border-radius: 50%; background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.25); display: none;
    pointer-events: none; margin: -60px 0 0 -60px;
  }
  #joyThumb {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(255,255,255,0.35);
    border: 2px solid rgba(255,255,255,0.55);
  }
  #fireBtn {
    position: absolute; pointer-events: auto;
    right: calc(env(safe-area-inset-right) + 26px);
    bottom: calc(env(safe-area-inset-bottom) + 30px);
    width: 96px; height: 96px; border-radius: 50%;
    background: rgba(255,80,80,0.30);
    border: 3px solid rgba(255,120,120,0.7);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; letter-spacing: 1px;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #fireBtn.active { background: rgba(255,80,80,0.55); transform: scale(0.94); }

  /* ---- Overlays ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 40%, rgba(20,26,38,0.72), rgba(6,8,12,0.92));
    pointer-events: auto;
  }
  .overlay h1 { font-size: clamp(34px, 8vw, 64px); font-weight: 800; letter-spacing: 1px; margin-bottom: 8px; }
  .overlay p { font-size: clamp(15px, 4vw, 19px); opacity: 0.85; max-width: 560px; line-height: 1.5; margin-bottom: 6px; }
  .overlay .big { font-size: clamp(20px, 5vw, 26px); opacity: 1; margin: 10px 0; font-weight: 700; }
  .btn {
    margin-top: 22px; pointer-events: auto;
    padding: 16px 34px; border-radius: 14px;
    background: linear-gradient(90deg, #ff5252, #ff8a4d);
    color: #fff; font-weight: 800; font-size: 19px; letter-spacing: 0.5px;
    border: none; box-shadow: 0 8px 24px rgba(255,80,80,0.35); cursor: pointer;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .hidden { display: none !important; }

  #rotateHint {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8,10,16,0.92); text-align: center; padding: 24px;
  }
  #rotateHint .icon { font-size: 64px; margin-bottom: 16px; animation: rock 1.6s ease-in-out infinite; }
  @keyframes rock { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(78deg); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="topbar">
    <div id="waveLabel" class="stat">WAVE 1</div>
    <div id="scoreLabel" class="stat">0</div>
  </div>
  <div id="healthWrap"><div id="healthBar"></div></div>

  <div id="touchUI">
    <div id="joystick"><div id="joyThumb"></div></div>
    <div id="fireBtn">FIRE</div>
  </div>
</div>

<div id="startScreen" class="overlay">
  <h1>ARENA FPS</h1>
  <p id="startHelp">Survive the waves. Shoot the robots before they reach you.</p>
  <button id="startBtn" class="btn">Tap to Start</button>
</div>

<div id="gameOver" class="overlay hidden">
  <h1>GAME OVER</h1>
  <div class="big" id="finalScore">Score: 0</div>
  <div class="big" id="finalWaves">Waves survived: 0</div>
  <button id="restartBtn" class="btn">Tap to Restart</button>
</div>

<div id="rotateHint">
  <div class="icon">📱</div>
  <p>Rotate your device to landscape for the best experience</p>
</div>

<script type="module">
import * as THREE from "three";

// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const ARENA = 38;                 // half-size of the square arena floor
const WALL_H = 7;
const PLAYER_HEIGHT = 1.7;
const PLAYER_RADIUS = 0.8;
const PLAYER_SPEED = 9;           // units/sec
const MAX_ENEMIES = 26;
const ENEMY_RADIUS = 0.9;
const FIRE_COOLDOWN = 0.16;       // seconds between shots
const MAX_HEALTH = 100;

const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;

// ---------------------------------------------------------------------------
// DOM
// ---------------------------------------------------------------------------
const app = document.getElementById("app");
const hud = document.getElementById("hud");
const waveLabel = document.getElementById("waveLabel");
const scoreLabel = document.getElementById("scoreLabel");
const healthBar = document.getElementById("healthBar");
const touchUI = document.getElementById("touchUI");
const joystick = document.getElementById("joystick");
const joyThumb = document.getElementById("joyThumb");
const fireBtn = document.getElementById("fireBtn");
const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");
const startHelp = document.getElementById("startHelp");
const gameOver = document.getElementById("gameOver");
const restartBtn = document.getElementById("restartBtn");
const finalScore = document.getElementById("finalScore");
const finalWaves = document.getElementById("finalWaves");
const rotateHint = document.getElementById("rotateHint");

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = 0x141a26;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 22, 78);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);

// Yaw object holds the camera; we rotate yaw for left/right and pitch on camera.
const yaw = new THREE.Object3D();
yaw.position.set(0, PLAYER_HEIGHT, 0);
yaw.add(camera);
scene.add(yaw);
let pitch = 0; // radians, clamped

// ---------------------------------------------------------------------------
// Lights
// ---------------------------------------------------------------------------
scene.add(new THREE.AmbientLight(0x8899bb, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
dirLight.position.set(20, 40, 12);
scene.add(dirLight);

// ---------------------------------------------------------------------------
// Arena geometry (shared materials)
// ---------------------------------------------------------------------------
const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a3142, roughness: 0.95, metalness: 0.0 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2, ARENA * 2), floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Grid lines for a low-poly arena feel.
const grid = new THREE.GridHelper(ARENA * 2, 30, 0x47506b, 0x353d52);
grid.position.y = 0.02;
scene.add(grid);

// Surrounding walls (4 boxes), shared material + geometry where possible.
const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a4258, roughness: 0.85 });
const wallThick = 1.5;
function makeWall(w, d, x, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, d), wallMat);
  m.position.set(x, WALL_H / 2, z);
  scene.add(m);
}
const span = ARENA * 2 + wallThick;
makeWall(span, wallThick, 0, -ARENA);   // north
makeWall(span, wallThick, 0, ARENA);    // south
makeWall(wallThick, span, -ARENA, 0);   // west
makeWall(wallThick, span, ARENA, 0);    // east

// ---------------------------------------------------------------------------
// Shared enemy resources
// ---------------------------------------------------------------------------
const enemyBodyGeo = new THREE.BoxGeometry(1.2, 1.6, 1.0);
const enemyHeadGeo = new THREE.BoxGeometry(0.8, 0.7, 0.8);
const enemyEyeGeo = new THREE.BoxGeometry(0.16, 0.16, 0.08);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffe14d, emissive: 0xffcc00, emissiveIntensity: 0.9 });
const enemyMatPool = []; // reused materials by tint index

function enemyMaterial(hue) {
  const m = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.55, 0.5), roughness: 0.6, metalness: 0.2 });
  enemyMatPool.push(m);
  return m;
}

// ---------------------------------------------------------------------------
// Particles (shared geometry/material; small pool of bursts)
// ---------------------------------------------------------------------------
const particleGeo = new THREE.BufferGeometry();
const PARTICLES_PER_BURST = 14;
function makeBurst(position, color) {
  const positions = new Float32Array(PARTICLES_PER_BURST * 3);
  const velocities = [];
  for (let i = 0; i < PARTICLES_PER_BURST; i++) {
    positions[i * 3] = position.x;
    positions[i * 3 + 1] = position.y;
    positions[i * 3 + 2] = position.z;
    const v = new THREE.Vector3(
      (Math.random() - 0.5),
      (Math.random() - 0.2),
      (Math.random() - 0.5)
    ).normalize().multiplyScalar(4 + Math.random() * 5);
    velocities.push(v);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color, size: 0.32, transparent: true, opacity: 1 });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  bursts.push({ points, velocities, life: 0.5, max: 0.5 });
}
const bursts = [];

// ---------------------------------------------------------------------------
// Muzzle flash (a small additive sprite-like plane in front of camera)
// ---------------------------------------------------------------------------
const muzzleMat = new THREE.MeshBasicMaterial({ color: 0xfff2a0, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthTest: false });
const muzzle = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), muzzleMat);
muzzle.position.set(0.12, -0.12, -0.6);
camera.add(muzzle);
let muzzleTime = 0;

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const enemies = [];
let wave = 0;
let score = 0;
let health = MAX_HEALTH;
let toSpawn = 0;             // enemies left to spawn this wave
let spawnTimer = 0;
let running = false;
let fireTimer = 0;

const raycaster = new THREE.Raycaster();
const screenCenter = new THREE.Vector2(0, 0);

function resetGame() {
  // remove existing enemies & bursts
  for (const e of enemies) scene.remove(e.group);
  enemies.length = 0;
  for (const b of bursts) scene.remove(b.points);
  bursts.length = 0;

  wave = 0; score = 0; health = MAX_HEALTH;
  yaw.position.set(0, PLAYER_HEIGHT, 0);
  yaw.rotation.set(0, 0, 0);
  pitch = 0;
  camera.rotation.set(0, 0, 0);
  updateHUD();
  startWave();
}

function startWave() {
  wave++;
  toSpawn = 4 + Math.floor(wave * 1.7);
  spawnTimer = 0;
  updateHUD();
}

function enemySpeedForWave() {
  return 1.7 + wave * 0.22;   // units/sec, grows each wave
}

function spawnEnemy() {
  if (enemies.length >= MAX_ENEMIES) return;

  const group = new THREE.Group();
  const hue = (0.0 + wave * 0.07) % 1.0;
  const bodyMat = enemyMaterial(hue);
  const body = new THREE.Mesh(enemyBodyGeo, bodyMat);
  body.position.y = 0.8;
  group.add(body);
  const head = new THREE.Mesh(enemyHeadGeo, bodyMat);
  head.position.y = 1.95;
  group.add(head);
  const eyeL = new THREE.Mesh(enemyEyeGeo, eyeMat); eyeL.position.set(-0.2, 2.0, 0.42); group.add(eyeL);
  const eyeR = new THREE.Mesh(enemyEyeGeo, eyeMat); eyeR.position.set(0.2, 2.0, 0.42); group.add(eyeR);

  // spawn at a random point along arena edge
  const edge = Math.floor(Math.random() * 4);
  const t = (Math.random() * 2 - 1) * (ARENA - 3);
  let x, z;
  if (edge === 0) { x = t; z = -(ARENA - 3); }
  else if (edge === 1) { x = t; z = ARENA - 3; }
  else if (edge === 2) { x = -(ARENA - 3); z = t; }
  else { x = ARENA - 3; z = t; }
  group.position.set(x, 0, z);
  scene.add(group);

  enemies.push({
    group, body,
    speed: enemySpeedForWave() * (0.85 + Math.random() * 0.3),
    hitFlash: 0,
    damageCooldown: 0,
    hue
  });
}

// ---------------------------------------------------------------------------
// Shooting
// ---------------------------------------------------------------------------
function shoot() {
  if (!running || fireTimer > 0) return;
  fireTimer = FIRE_COOLDOWN;

  // muzzle flash
  muzzleMat.opacity = 1;
  muzzleTime = 0.06;

  raycaster.setFromCamera(screenCenter, camera);
  // Test against enemy body meshes.
  const meshes = enemies.map(e => e.body);
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    const hitMesh = hits[0].object;
    const idx = enemies.findIndex(e => e.body === hitMesh);
    if (idx !== -1) killEnemy(idx, hits[0].point);
  }
}

function killEnemy(idx, point) {
  const e = enemies[idx];
  const color = new THREE.Color().setHSL(e.hue, 0.7, 0.6);
  makeBurst(point || e.group.position.clone().setY(1.2), color);
  scene.remove(e.group);
  // dispose per-enemy material (geometries are shared)
  if (e.body.material) e.body.material.dispose();
  enemies.splice(idx, 1);
  score += 10;
  updateHUD();
}

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------
function updateHUD() {
  waveLabel.textContent = "WAVE " + wave;
  scoreLabel.textContent = String(score);
  healthBar.style.width = Math.max(0, (health / MAX_HEALTH) * 100) + "%";
}

// ---------------------------------------------------------------------------
// Input: desktop (pointer lock + WASD + click)
// ---------------------------------------------------------------------------
const keys = {};
window.addEventListener("keydown", e => { keys[e.code] = true; });
window.addEventListener("keyup", e => { keys[e.code] = false; });

const PITCH_LIMIT = Math.PI / 2 - 0.05;

function applyLook(dx, dy, sensitivity) {
  yaw.rotation.y -= dx * sensitivity;
  pitch -= dy * sensitivity;
  pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch));
  camera.rotation.x = pitch;
}

if (!isTouch) {
  const canvas = renderer.domElement;
  canvas.addEventListener("click", () => {
    if (running && document.pointerLockElement !== canvas) {
      canvas.requestPointerLock();
    }
  });
  document.addEventListener("mousemove", e => {
    if (document.pointerLockElement === canvas) {
      applyLook(e.movementX, e.movementY, 0.0022);
    }
  });
  document.addEventListener("mousedown", e => {
    if (e.button === 0 && document.pointerLockElement === canvas) shoot();
  });
}

// ---------------------------------------------------------------------------
// Input: touch (left = joystick, right = look, fire button)
// ---------------------------------------------------------------------------
let moveTouchId = null;
let lookTouchId = null;
const joyOrigin = { x: 0, y: 0 };
const moveVec = { x: 0, y: 0 };  // normalized -1..1
let lookLast = { x: 0, y: 0 };
let touchFiring = false;

function isRightHalf(x) { return x > window.innerWidth * 0.5; }

if (isTouch) {
  const surface = renderer.domElement;

  surface.addEventListener("touchstart", e => {
    for (const t of e.changedTouches) {
      if (!isRightHalf(t.clientX) && moveTouchId === null) {
        moveTouchId = t.identifier;
        joyOrigin.x = t.clientX; joyOrigin.y = t.clientY;
        joystick.style.display = "block";
        joystick.style.left = t.clientX + "px";
        joystick.style.top = t.clientY + "px";
        joyThumb.style.transform = "translate(0px, 0px)";
      } else if (isRightHalf(t.clientX) && lookTouchId === null) {
        lookTouchId = t.identifier;
        lookLast.x = t.clientX; lookLast.y = t.clientY;
      }
    }
  }, { passive: false });

  surface.addEventListener("touchmove", e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === moveTouchId) {
        let dx = t.clientX - joyOrigin.x;
        let dy = t.clientY - joyOrigin.y;
        const max = 52;
        const len = Math.hypot(dx, dy) || 1;
        const cl = Math.min(len, max);
        const nx = (dx / len) * cl;
        const ny = (dy / len) * cl;
        joyThumb.style.transform = "translate(" + nx + "px," + ny + "px)";
        moveVec.x = nx / max;
        moveVec.y = ny / max;
      } else if (t.identifier === lookTouchId) {
        const dx = t.clientX - lookLast.x;
        const dy = t.clientY - lookLast.y;
        lookLast.x = t.clientX; lookLast.y = t.clientY;
        applyLook(dx, dy, 0.004);
      }
    }
  }, { passive: false });

  function endTouch(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === moveTouchId) {
        moveTouchId = null;
        moveVec.x = 0; moveVec.y = 0;
        joystick.style.display = "none";
      } else if (t.identifier === lookTouchId) {
        lookTouchId = null;
      }
    }
  }
  surface.addEventListener("touchend", endTouch, { passive: false });
  surface.addEventListener("touchcancel", endTouch, { passive: false });

  // Fire button (continuous fire while held).
  fireBtn.addEventListener("touchstart", e => {
    e.preventDefault(); e.stopPropagation();
    touchFiring = true; fireBtn.classList.add("active");
  }, { passive: false });
  const stopFire = () => { touchFiring = false; fireBtn.classList.remove("active"); };
  fireBtn.addEventListener("touchend", stopFire);
  fireBtn.addEventListener("touchcancel", stopFire);
}

// ---------------------------------------------------------------------------
// Movement + collisions
// ---------------------------------------------------------------------------
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const tmp = new THREE.Vector3();

function updatePlayer(dt) {
  // Determine movement intent.
  let ix = 0, iz = 0; // x = strafe, z = forward(-)/back(+)
  if (isTouch) {
    ix = moveVec.x;
    iz = moveVec.y;
  } else {
    if (keys["KeyW"]) iz -= 1;
    if (keys["KeyS"]) iz += 1;
    if (keys["KeyA"]) ix -= 1;
    if (keys["KeyD"]) ix += 1;
  }
  const mag = Math.hypot(ix, iz);
  if (mag > 1) { ix /= mag; iz /= mag; }

  if (mag > 0.001) {
    // Camera-forward and camera-right on the XZ plane based on yaw.
    forward.set(-Math.sin(yaw.rotation.y), 0, -Math.cos(yaw.rotation.y));
    right.set(Math.cos(yaw.rotation.y), 0, -Math.sin(yaw.rotation.y));
    tmp.set(0, 0, 0)
      .addScaledVector(forward, -iz)   // iz negative = forward
      .addScaledVector(right, ix)
      .normalize()
      .multiplyScalar(PLAYER_SPEED * dt);
    yaw.position.x += tmp.x;
    yaw.position.z += tmp.z;

    const lim = ARENA - PLAYER_RADIUS - wallThick / 2;
    yaw.position.x = Math.max(-lim, Math.min(lim, yaw.position.x));
    yaw.position.z = Math.max(-lim, Math.min(lim, yaw.position.z));
  }
}

// ---------------------------------------------------------------------------
// Enemy update
// ---------------------------------------------------------------------------
const dir2 = new THREE.Vector3();
function updateEnemies(dt) {
  const px = yaw.position.x, pz = yaw.position.z;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    dir2.set(px - e.group.position.x, 0, pz - e.group.position.z);
    const dist = dir2.length();
    if (dist > 0.0001) dir2.multiplyScalar(1 / dist);

    // face the player
    e.group.rotation.y = Math.atan2(dir2.x, dir2.z);

    // move toward player (stop when touching)
    if (dist > PLAYER_RADIUS + ENEMY_RADIUS) {
      e.group.position.x += dir2.x * e.speed * dt;
      e.group.position.z += dir2.z * e.speed * dt;
    } else {
      // contact damage on a cooldown
      e.damageCooldown -= dt;
      if (e.damageCooldown <= 0) {
        e.damageCooldown = 0.6;
        health -= 8;
        updateHUD();
        if (health <= 0) { health = 0; endGame(); return; }
      }
    }

    // separation so robots don't perfectly overlap
    for (let j = i - 1; j >= 0; j--) {
      const o = enemies[j];
      const ddx = e.group.position.x - o.group.position.x;
      const ddz = e.group.position.z - o.group.position.z;
      const d2 = ddx * ddx + ddz * ddz;
      const minD = ENEMY_RADIUS * 2;
      if (d2 < minD * minD && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        const push = (minD - d) * 0.5;
        const ux = ddx / d, uz = ddz / d;
        e.group.position.x += ux * push; e.group.position.z += uz * push;
        o.group.position.x -= ux * push; o.group.position.z -= uz * push;
      }
    }

    // little bob animation
    e.group.position.y = Math.sin(performance.now() * 0.006 + i) * 0.06;
  }

  // wave progression: spawn over time, then advance when cleared
  if (toSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      toSpawn--;
      spawnTimer = Math.max(0.25, 0.9 - wave * 0.04);
    }
  } else if (enemies.length === 0) {
    startWave();
  }
}

// ---------------------------------------------------------------------------
// Bursts (particles) update
// ---------------------------------------------------------------------------
function updateBursts(dt) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.life -= dt;
    const pos = b.points.geometry.attributes.position;
    for (let p = 0; p < PARTICLES_PER_BURST; p++) {
      const v = b.velocities[p];
      v.y -= 9 * dt; // gravity
      pos.array[p * 3] += v.x * dt;
      pos.array[p * 3 + 1] += v.y * dt;
      pos.array[p * 3 + 2] += v.z * dt;
    }
    pos.needsUpdate = true;
    b.points.material.opacity = Math.max(0, b.life / b.max);
    if (b.life <= 0) {
      scene.remove(b.points);
      b.points.geometry.dispose();
      b.points.material.dispose();
      bursts.splice(i, 1);
    }
  }
}

// ---------------------------------------------------------------------------
// Game flow
// ---------------------------------------------------------------------------
function startGame() {
  startScreen.classList.add("hidden");
  gameOver.classList.add("hidden");
  hud.classList.remove("hidden");
  if (isTouch) touchUI.style.display = "block";
  resetGame();
  running = true;
  lastT = performance.now();
}

function endGame() {
  running = false;
  finalScore.textContent = "Score: " + score;
  finalWaves.textContent = "Waves survived: " + Math.max(0, wave - 1);
  gameOver.classList.remove("hidden");
  if (document.pointerLockElement) document.exitPointerLock();
}

startBtn.addEventListener("click", startGame);
restartBtn.addEventListener("click", startGame);

// ---------------------------------------------------------------------------
// Resize + orientation
// ---------------------------------------------------------------------------
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  checkOrientation();
}
function checkOrientation() {
  if (isTouch && window.innerHeight > window.innerWidth) {
    rotateHint.style.display = "flex";
  } else {
    rotateHint.style.display = "none";
  }
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", () => setTimeout(onResize, 150));

// Prevent gesture zoom / double-tap zoom on the document.
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05; // clamp

  if (running) {
    fireTimer = Math.max(0, fireTimer - dt);
    if (isTouch && touchFiring) shoot();
    if (!isTouch && keys["Space"]) shoot();

    updatePlayer(dt);
    updateEnemies(dt);
    updateBursts(dt);

    // muzzle flash fade
    if (muzzleTime > 0) {
      muzzleTime -= dt;
      muzzleMat.opacity = Math.max(0, muzzleTime / 0.06);
      muzzle.rotation.z = Math.random() * Math.PI;
    }
  }

  renderer.render(scene, camera);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
if (isTouch) {
  startHelp.textContent = "Left side to move • Right side to look • FIRE to shoot. Survive the waves!";
} else {
  startHelp.textContent = "WASD to move • Mouse to look (click to lock) • Left-click or Space to shoot. Survive the waves!";
}
checkOrientation();
requestAnimationFrame(loop);
</script>
